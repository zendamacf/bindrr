name: Tag new npm package releases

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - package.json

jobs:
  tag-npm-release:
    name: Tag NPM package releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PAT so the tag push triggers other workflows (GITHUB_TOKEN suppresses them).
          token: ${{ secrets.REPO_PAT }}
          fetch-depth: 0

      - uses: neverendingqs/gh-action-tag-on-npm-version@master
